<style>
:root{--gr-orange:#FF783F;--gr-orange-hover:#F26732;--gr-orange-soft:#FFF3EB;--gr-orange-subtle:#FFE9DC;
--gr-navy:#0F172A;--gr-bg:#FFFFFF;--gr-surface:#FFFFFF;--gr-text:#0F172A;--gr-muted:#4A566C;--gr-border:#E5E7EB;--gr-ring:rgba(255,120,63,.25);}
[data-theme="dark"]{--gr-bg:#0F172A;--gr-surface:#1E293B;--gr-text:#FFFFFF;--gr-muted:#CBD5E1;--gr-border:#334155;
--gr-orange-soft:rgba(255,120,63,.12);--gr-orange-subtle:rgba(255,120,63,.2);--gr-ring:rgba(255,120,63,.4);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--gr-bg:#0F172A;--gr-surface:#1E293B;--gr-text:#FFFFFF;--gr-muted:#CBD5E1;--gr-border:#334155;
--gr-orange-soft:rgba(255,120,63,.12);--gr-orange-subtle:rgba(255,120,63,.2);--gr-ring:rgba(255,120,63,.4);}}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Poppins,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--gr-bg);color:var(--gr-text);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img,svg{display:block}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
.wm{fill:var(--gr-text)}
.logo{height:44px;width:auto}
.ico{width:24px;height:24px}
/* nav */
.nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--gr-bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--gr-border)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:72px;gap:16px}
.nav ul{display:flex;list-style:none;font-size:14px;color:var(--gr-muted)}
.nav ul li{margin-left:28px}
.nav ul a:hover{color:var(--gr-orange)}
.nav-actions{display:flex;align-items:center}
.nav-actions > *{margin-left:12px}
.icon-btn{width:40px;height:40px;border-radius:999px;border:1px solid var(--gr-border);background:var(--gr-surface);color:var(--gr-text);display:flex;align-items:center;justify-content:center;cursor:pointer}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 22px;border-radius:999px;font-weight:600;font-size:15px;border:0;cursor:pointer;transition:background .2s,transform .1s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--gr-orange);color:#fff}
.btn-primary:hover{background:var(--gr-orange-hover)}
.btn-ghost{background:transparent;color:var(--gr-text);border:1px solid var(--gr-border)}
.btn-ghost:hover{border-color:var(--gr-orange)}
.btn-sm{height:40px;padding:0 16px;font-size:14px}
/* hero */
.hero{padding:88px 0 72px}
.hero .wrap{display:flex;flex-wrap:wrap;align-items:center}
.hero .wrap > div:first-child{flex:1 1 440px;padding-right:32px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;background:var(--gr-orange-soft);color:var(--gr-orange-hover);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:500}
h1{font-size:clamp(36px,5.2vw,60px);line-height:1.12;font-weight:700;letter-spacing:-.02em;margin:20px 0 18px}
h1 .accent{color:var(--gr-orange)}
.lead{font-size:18px;color:var(--gr-muted);max-width:520px}
.cta-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}
.hero-visual{position:relative;flex:1 1 380px;height:460px;margin:24px 0;border-radius:32px;background:linear-gradient(160deg,var(--gr-orange-soft),var(--gr-orange-subtle));display:flex;align-items:center;justify-content:center}
.hero-visual .mark{width:55%;height:auto}
.chip{position:absolute;background:var(--gr-surface);border:1px solid var(--gr-border);border-radius:14px;padding:10px 14px;font-size:13px;box-shadow:0 8px 24px rgba(15,23,42,.08);display:flex;gap:10px;align-items:center}
.chip .dot{width:8px;height:8px;border-radius:50%;background:#22C55E}
.chip-a{top:10%;left:6%}
.chip-b{bottom:10%;right:6%}
/* sections */
section{padding:88px 0}
.section-head{text-align:center;max-width:640px;margin:0 auto 52px}
.section-head h2{font-size:clamp(28px,3.6vw,40px);font-weight:700;letter-spacing:-.01em;line-height:1.2}
.section-head p{color:var(--gr-muted);margin-top:12px}
.trust{padding:28px 0;border-block:1px solid var(--gr-border)}
.trust .wrap{display:flex;justify-content:center;flex-wrap:wrap;color:var(--gr-muted);font-size:14px;font-weight:500;letter-spacing:.08em;text-transform:uppercase}
.trust .wrap span{margin:0 14px}
.grid-5{display:flex;flex-wrap:wrap;margin:-9px}
.grid-5 > .card{flex:1 1 200px;margin:9px}
.card{background:var(--gr-surface);border:1px solid var(--gr-border);border-radius:20px;padding:26px 22px;transition:border-color .2s,transform .2s}
.card:hover{border-color:var(--gr-orange);transform:translateY(-3px)}
.card .badge{width:52px;height:52px;border-radius:16px;background:var(--gr-orange-soft);color:var(--gr-orange);display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.card h3{font-size:17px;font-weight:600;margin-bottom:6px}
.card p{font-size:14px;color:var(--gr-muted)}
.steps{display:flex;flex-wrap:wrap;margin:-12px}
.steps > .step{flex:1 1 280px;margin:12px}
.step{position:relative;padding:28px;border-radius:20px;background:var(--gr-surface);border:1px solid var(--gr-border)}
.step .num{font-size:13px;font-weight:600;color:var(--gr-orange);letter-spacing:.1em;text-transform:uppercase}
.step h3{font-size:20px;font-weight:600;margin:10px 0 8px}
.step p{color:var(--gr-muted);font-size:15px}
.band{background:var(--gr-navy);color:#fff;border-radius:28px;padding:56px 40px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap}
.band h2{font-size:clamp(26px,3vw,36px);font-weight:700;line-height:1.2}
.band p{color:#CBD5E1;margin-top:8px}
.band .btn-primary{background:var(--gr-orange)}
footer{padding:48px 0 56px;border-top:1px solid var(--gr-border);margin-top:40px}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;align-items:center;color:var(--gr-muted);font-size:14px}
footer nav{display:flex}
footer nav a{margin-right:22px}
/* chatbot widget */
.cw-launch{position:fixed;right:24px;bottom:24px;width:64px;height:64px;border-radius:50%;background:var(--gr-orange);border:0;cursor:pointer;box-shadow:0 12px 30px rgba(255,120,63,.4);display:flex;align-items:center;justify-content:center;z-index:50}
.cw-launch:hover{background:var(--gr-orange-hover)}
.cw-launch .mark-mono{width:34px;height:34px;fill:#fff;display:block}
.cw-panel{position:fixed;right:24px;bottom:104px;width:360px;max-width:calc(100vw - 32px);height:520px;max-height:calc(100vh - 140px);background:var(--gr-surface);border:1px solid var(--gr-border);border-radius:20px;box-shadow:0 24px 60px rgba(15,23,42,.18);display:none;flex-direction:column;overflow:hidden;z-index:50}
.cw-panel.open{display:flex}
.cw-head{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--gr-navy);color:#fff}
.cw-avatar{width:40px;height:40px;border-radius:50%;background:var(--gr-orange-soft);display:flex;align-items:center;justify-content:center;flex:none}
.cw-avatar .mark{width:26px;height:auto}
.cw-title{font-weight:600;font-size:15px;line-height:1.2}
.cw-status{font-size:12px;color:#CBD5E1;display:flex;align-items:center;gap:6px}
.cw-status .dot{width:7px;height:7px;border-radius:50%;background:#22C55E}
.cw-close{margin-left:auto;background:none;border:0;color:#fff;cursor:pointer;padding:6px;border-radius:8px}
.cw-close:hover{background:rgba(255,255,255,.1)}
.cw-body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:16px;display:block;background:var(--gr-bg)}
.cw-body .msg{display:block;margin-bottom:10px}
.cw-body .msg.user{margin-left:auto}
.msg{max-width:82%;display:inline-block;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.45;word-wrap:break-word}
.msg.bot{background:var(--gr-surface);border:1px solid var(--gr-border);color:var(--gr-text);border-bottom-left-radius:4px;align-self:flex-start}
.msg.user{background:var(--gr-orange);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.quick button{border:1px solid var(--gr-orange);background:var(--gr-orange-soft);color:var(--gr-orange-hover);padding:6px 12px;border-radius:999px;font-size:13px;cursor:pointer;font-family:inherit}
.quick button:hover{background:var(--gr-orange);color:#fff}
.typing{align-self:flex-start;background:var(--gr-surface);border:1px solid var(--gr-border);border-radius:16px;padding:8px 12px;display:none}
.typing.show{display:block}
.typing{color:var(--gr-muted)}
.typing svg{width:44px;height:24px}
.cw-foot{display:flex;gap:8px;padding:12px;border-top:1px solid var(--gr-border);background:var(--gr-surface)}
.cw-foot input{flex:1;height:42px;border-radius:999px;border:1px solid var(--gr-border);background:var(--gr-bg);color:var(--gr-text);padding:0 16px;font:inherit;font-size:14px;outline:none}
.cw-foot input:focus{border-color:var(--gr-orange);box-shadow:0 0 0 4px var(--gr-ring)}
.cw-send{width:42px;height:42px;border-radius:50%;border:0;background:var(--gr-orange);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.cw-send .ico{width:18px;height:18px}
@media (max-width:900px){.nav ul{display:none}}
@media (max-width:560px){.cw-panel{right:12px;left:12px;width:auto}.cw-launch{right:16px;bottom:16px}.hero-visual{height:340px}}
</style>
</head>

<script>
(function(){
  const launch=document.querySelector('.cw-launch'), panel=document.querySelector('.cw-panel'),
        body=document.querySelector('.cw-body'), form=document.querySelector('.cw-form'),
        input=document.querySelector('.cw-form input'), typing=document.querySelector('.typing'),
        closeBtn=document.querySelector('.cw-close');
  const replies={
    'cara daftar':'Daftar cukup 2 menit: isi nama usaha, email, lalu verifikasi. Mau saya bantu buatkan toko pertama Anda?',
    'harga paket':'Ada beberapa pilihan paket sesuai kebutuhan. Saya bisa arahkan Anda ke halaman harga terbaru.',
    'cek pesanan':'Silakan kirim nomor pesanan Anda, nanti saya bantu cek statusnya.'
  };
  function add(text,cls){const d=document.createElement('div');d.className='msg '+cls;d.textContent=text;body.insertBefore(d,typing);body.scrollTop=body.scrollHeight;return d;}
  function botSay(text,quick){
    typing.classList.add('show'); body.scrollTop=body.scrollHeight;
    setTimeout(()=>{
      typing.classList.remove('show');
      const m=add(text,'bot');
      if(quick){const q=document.createElement('div');q.className='quick';
        quick.forEach(label=>{const b=document.createElement('button');b.type='button';b.textContent=label;
          b.onclick=()=>{q.remove();userSay(label);};q.appendChild(b);});
        m.appendChild(q);}
    },900);
  }
  function userSay(text){
    add(text,'user');
    const key=text.toLowerCase();
    botSay(replies[key]||'Terima kasih, saya catat pertanyaannya. Tim kami akan segera membantu Anda.', null);
  }
  launch.addEventListener('click',()=>{panel.classList.toggle('open'); if(panel.classList.contains('open')) input.focus();});
  closeBtn.addEventListener('click',()=>panel.classList.remove('open'));
  form.addEventListener('submit',e=>{e.preventDefault(); const v=input.value.trim(); if(!v) return; input.value=''; userSay(v);});
  document.querySelectorAll('[data-open-chat]').forEach(b=>b.addEventListener('click',()=>{panel.classList.add('open');input.focus();}));
  document.querySelectorAll('.qbtn').forEach(b=>b.addEventListener('click',()=>{b.closest('.quick').remove();userSay(b.textContent);}));
  const tbtn=document.querySelector('[data-theme-toggle]');
  if(tbtn) tbtn.addEventListener('click',()=>{
    const root=document.documentElement; const dark=(root.getAttribute('data-theme')||'')==='dark' || (!root.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
    root.setAttribute('data-theme', dark?'light':'dark');
  });
})();
</script>
</body>
</html>
